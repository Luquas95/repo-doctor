name: Release
# Vydání se spouští tagem `vX.Y.Z` (musí odpovídat verzi v pyproject.toml):
#   sestavení → test instalace na distribucích → GitHub Release → APT/RPM repozitář na Pages.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 2.35 – sestavená aplikace poběží na Ubuntu 22.04+, Debianu 12+, Fedoře…
    container: ubuntu:22.04
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: systémové nástroje
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils ca-certificates curl git gnupg
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: tag odpovídá verzi
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "$TAG" = "v$version" || { echo "Tag $TAG ≠ verze $version v pyproject.toml"; exit 1; }
      - run: uv sync --locked --no-dev --group build
      - name: sestavení aplikace
        run: uv run --no-sync packaging/build.sh
      - name: nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: balíčky a podpis
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg" NFPM_RPM_KEY_FILE="$RUNNER_TEMP/signing.key"
          install -d -m 700 "$GNUPGHOME"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$NFPM_RPM_KEY_FILE")
          gpg --batch --quiet --import "$NFPM_RPM_KEY_FILE"
          packaging/package.sh
          packaging/sign.sh
          rm -f "$NFPM_RPM_KEY_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  test-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb }
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "fedora:42", kind: rpm }
          - { image: "archlinux:latest", kind: aur }
          - { image: "ubuntu:22.04", kind: tarball }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: rel
      - name: instalace (${{ matrix.kind }})
        env:
          KIND: ${{ matrix.kind }}
        run: |
          case "$KIND" in
            deb)
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$PWD/rel/repo-doctor_amd64.deb"
              test -f /etc/apt/sources.list.d/repo-doctor.list ;;
            rpm)
              dnf install -y -q rel/repo-doctor.x86_64.rpm
              test -f /etc/yum.repos.d/repo-doctor.repo ;;
            aur)
              pacman -Sy --noconfirm --needed base-devel git
              useradd -m builder && install -d -o builder /build
              cp rel/PKGBUILD /build/
              ver=$(sed -n 's/^pkgver=//p' rel/PKGBUILD)
              cp rel/repo-doctor-linux-x86_64.tar.gz "/build/repo-doctor-linux-x86_64-$ver.tar.gz"
              chown -R builder /build
              su builder -c "cd /build && makepkg --noconfirm"
              pacman -U --noconfirm /build/*.pkg.tar.zst ;;
            tarball)
              apt-get update -qq && apt-get install -y -qq git
              useradd -m user
              su user -c "cd ~ && tar xzf $PWD/rel/repo-doctor-linux-x86_64.tar.gz && ./repo-doctor/install.sh"
              ln -s /home/user/.local/bin/repo-doctor /usr/local/bin/repo-doctor ;;
          esac
      - name: aplikace běží
        env:
          KIND: ${{ matrix.kind }}
        run: |
          repo-doctor --version
          repo-doctor checks
          repo-doctor explain secrets-history > /dev/null
          installed=$(cat "$(dirname "$(readlink -f "$(command -v repo-doctor)")")/install-kind")
          test "$installed" = "${KIND/aur/pacman}"

  publish:
    needs: test-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist/release
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "repo-doctor ${TAG#v}" --notes-file notes.md \
            dist/release/repo-doctor_amd64.deb dist/release/repo-doctor.x86_64.rpm \
            dist/release/repo-doctor-linux-x86_64.tar.gz dist/release/PKGBUILD \
            dist/release/SHA256SUMS dist/release/SHA256SUMS.asc

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist/release
      - name: APT a RPM repozitář
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apt-utils createrepo-c
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          packaging/repo.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
