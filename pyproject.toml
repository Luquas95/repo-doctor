[project]
name = "repo-doctor"
version = "0.1.1"
description = "TUI pro audit a údržbu lokálních git repozitářů (bezpečnost, hygiena, stav gitu, git hostingy)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "repo-doctor contributors" }]
requires-python = ">=3.12"
keywords = ["git", "audit", "tui", "security", "textual"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "textual>=3.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tomlkit>=0.12",
    "keyring>=24",
    "packaging>=23",
    "rich>=13.7",
]

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-textual-snapshot>=1.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_doctor"]

[tool.hatch.build.targets.wheel.force-include]
"docs/checks" = "repo_doctor/_checkdocs"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "C4", "RET"]
ignore = [
    "S603", # subprocess bez shellu je záměr – argumenty jsou vždy seznam
    "S607", # `git` hledáme v PATH
    "RUF001", "RUF002", "RUF003", # česká diakritika a typografické znaky jsou záměrné
    "E501",   # délku řádků hlídá formátovač, dlouhé řetězce/komentáře jsou v pořádku
    "S105", "S106", # „token_source“ apod. nejsou hesla – skutečné tokeny do kódu nikdy nejdou
    "PTH111", "PTH117", "PTH118", "PTH119", "PTH120", # os.path je u scandir/realpath čitelnější
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "PTH"]
"src/repo_doctor/tui/**" = ["RUF012"]  # Textual BINDINGS/CSS jsou idiomaticky třídní seznamy

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["benchmark: výkonnostní test nad syntetickou sadou repozitářů"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["repo_doctor"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
